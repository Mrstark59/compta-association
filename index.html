<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comptabilité de l'association</title>
<style>
  :root { --bg:#0f0b1a; --card:#1a1428; --line:#2d2444; --txt:#eae6f5; --mute:#8f86a8; --acc:#8b5cf6; --ok:#34d399; --ko:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 system-ui,sans-serif; padding:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  h1 { font-size:22px; margin:0 0 4px; }
  input, select, button { font:inherit; color:var(--txt); background:#120d20; border:1px solid var(--line); border-radius:9px; padding:10px 12px; }
  input:focus, select:focus { outline:2px solid var(--acc); }
  button { cursor:pointer; background:var(--acc); border:0; font-weight:600; }
  button:hover { filter:brightness(1.1); }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--mute); font-weight:400; }
  #login { max-width:340px; margin:12vh auto; display:grid; gap:10px; }
  #login p { margin:0 0 6px; color:var(--mute); font-size:13px; }
  #erreur { color:var(--ko); font-size:13px; min-height:18px; }
  #app { max-width:1100px; margin:auto; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .hide { display:none !important; }

  /* NOUVEAU : le résumé  [Espèces] + [Banque] = [Total] */
  .resume { display:flex; align-items:stretch; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .resume .card { flex:1; min-width:150px; padding:16px; }
  .resume .op { align-self:center; font-size:26px; color:var(--mute); }
  .resume small { color:var(--mute); }
  .resume b { display:block; font-size:26px; margin-top:2px; font-variant-numeric:tabular-nums; }
  .resume .total { border-color:var(--acc); }
  .alerte { color:var(--ko); font-size:12px; min-height:18px; }

  #formAjout { display:grid; grid-template-columns:140px 1fr 150px 140px 130px auto; gap:8px; margin-bottom:18px; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:10px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--mute); font-weight:500; font-size:13px; }
  .n { text-align:right; font-variant-numeric:tabular-nums; }
  td.designation { white-space:normal; }
  .recette { color:var(--ok); } .depense { color:var(--ko); }
  .tag { background:#241b3a; border-radius:6px; padding:2px 8px; font-size:12px; }

  /* NOUVEAU : fenêtre "soldes de départ" (balise <dialog>, native) */
  dialog { background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:14px; padding:22px; width:min(380px,92vw); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog label { display:block; margin:12px 0 4px; color:var(--mute); font-size:13px; }
  dialog input { width:100%; }
  dialog .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }

  @media (max-width:800px) { #formAjout { grid-template-columns:1fr 1fr; } #formAjout input[name=designation] { grid-column:1/-1; } }
</style>
</head>
<body>

<form id="login" class="card hide">
  <div><h1>Comptabilité</h1><p>Accès réservé aux membres.</p></div>
  <input id="email" type="email" placeholder="Email" autocomplete="username" required>
  <input id="mdp" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
  <button type="submit">Se connecter</button>
  <div id="erreur"></div>
</form>

<div id="app" class="hide">
  <div class="top">
    <h1>Comptabilité de l'association</h1>
    <div>
      <span id="qui" style="color:var(--mute);margin-right:10px"></span>
      <button class="ghost" id="btnDepart">Soldes de départ</button>
      <button class="ghost" id="btnSortir">Déconnexion</button>
    </div>
  </div>

  <!-- NOUVEAU : résumé -->
  <div class="resume">
    <div class="card"><small>Caisse (espèces)</small><b id="sCaisse">0,00 €</b><div class="alerte" id="alerteCaisse"></div></div>
    <div class="op">+</div>
    <div class="card"><small>Banque (CB, chèque, virement)</small><b id="sBanque">0,00 €</b></div>
    <div class="op">=</div>
    <div class="card total"><small>Solde total</small><b id="sTotal">0,00 €</b></div>
  </div>

  <div class="card">
    <form id="formAjout">
      <input name="date" type="date" required>
      <input name="designation" placeholder="Désignation (raison)" maxlength="120" required>
      <select name="mode">
        <option value="cb">CB</option>
        <option value="especes">Espèces</option>
        <option value="cheque">Chèque</option>
        <option value="virement">Virement</option>
      </select>
      <select name="type">
        <option value="recette">Recette (+)</option>
        <option value="depense">Dépense (−)</option>
      </select>
      <input name="montant" type="number" step="0.01" min="0.01" placeholder="Montant €" required>
      <button type="submit">Ajouter</button>
    </form>

    <div class="scroll">
      <table>
        <thead>
          <tr><th>Date</th><th>Désignation</th><th>Mode</th><th class="n">Recette (+)</th><th class="n">Dépense (−)</th><th class="n">Solde</th></tr>
        </thead>
        <tbody id="lignes"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- NOUVEAU : fenêtre des soldes de départ -->
<dialog id="dlgDepart">
  <form id="formDepart" method="dialog">
    <h1 style="font-size:18px">Soldes de départ</h1>
    <p style="color:var(--mute);font-size:13px;margin:6px 0 0">Ce qu'il y avait en caisse et en banque <b>avant</b> la première écriture saisie.</p>
    <label for="dCaisse">Caisse espèces (€)</label>
    <input id="dCaisse" type="number" step="0.01" required>
    <label for="dBanque">Banque (€)</label>
    <input id="dBanque" type="number" step="0.01" required>
    <div class="btns">
      <button type="button" class="ghost" id="dAnnuler">Annuler</button>
      <button type="submit">Enregistrer</button>
    </div>
  </form>
</dialog>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  // NOUVEAU : doc + setDoc pour lire/écrire UN document précis (les soldes de départ)
  import { getFirestore, collection, doc, addDoc, setDoc, onSnapshot, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDFaVObQHuck-Sov9MEinivmLfvy59SE1A",
    authDomain: "compta-association-dbd22.firebaseapp.com",
    projectId: "compta-association-dbd22",
    storageBucket: "compta-association-dbd22.firebasestorage.app",
    messagingSenderId: "35641159683",
    appId: "1:35641159683:web:500fe151f25bc491829e36"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const ecrituresRef = collection(db, "ecritures");
  const departRef = doc(db, "config", "depart");   // NOUVEAU : un seul document "config/depart" pour les soldes de départ

  const $ = id => document.getElementById(id);
  const NOMS_MODES = { cb: "CB", especes: "Espèces", cheque: "Chèque", virement: "Virement" };
  const euros = centimes => (centimes / 100).toLocaleString("fr-FR", { style: "currency", currency: "EUR" });

  let ecritures = [];
  let depart = { caisseCts: 0, banqueCts: 0 };   // NOUVEAU
  let arreterEcoutes = [];

  // ---------- CONNEXION ----------
  onAuthStateChanged(auth, utilisateur => {
    $("login").classList.toggle("hide", !!utilisateur);
    $("app").classList.toggle("hide", !utilisateur);
    arreterEcoutes.forEach(stop => stop()); arreterEcoutes = [];
    if (!utilisateur) { ecritures = []; return; }
    $("qui").textContent = utilisateur.email;

    arreterEcoutes.push(onSnapshot(ecrituresRef, res => {
      ecritures = res.docs.map(d => ({ id: d.id, ...d.data() }));
      afficher();
    }, err => console.error("Lecture écritures refusée :", err)));

    // NOUVEAU : on écoute aussi les soldes de départ
    arreterEcoutes.push(onSnapshot(departRef, d => {
      depart = d.exists() ? d.data() : { caisseCts: 0, banqueCts: 0 };
      afficher();
    }, err => console.error("Lecture départ refusée :", err)));
  });

  $("login").addEventListener("submit", async e => {
    e.preventDefault();
    $("erreur").textContent = "";
    try { await signInWithEmailAndPassword(auth, $("email").value, $("mdp").value); }
    catch (err) { console.error(err); $("erreur").textContent = "Email ou mot de passe incorrect."; }
  });
  $("btnSortir").addEventListener("click", () => signOut(auth));

  // ---------- AJOUT ----------
  $("formAjout").addEventListener("submit", async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    await addDoc(ecrituresRef, {
      date: f.get("date"),
      designation: f.get("designation").trim(),
      mode: f.get("mode"),
      type: f.get("type"),
      montantCts: Math.round(parseFloat(f.get("montant")) * 100),
      creeLe: serverTimestamp()
    });
    const date = f.get("date");
    e.target.reset();
    e.target.date.value = date;
    e.target.designation.focus();
  });

  // ---------- SOLDES DE DÉPART (NOUVEAU) ----------
  $("btnDepart").addEventListener("click", () => {
    $("dCaisse").value = depart.caisseCts / 100;   // on repasse des centimes aux euros pour l'affichage
    $("dBanque").value = depart.banqueCts / 100;
    $("dlgDepart").showModal();
  });
  $("dAnnuler").addEventListener("click", () => $("dlgDepart").close());
  $("formDepart").addEventListener("submit", async () => {
    await setDoc(departRef, {
      caisseCts: Math.round(parseFloat($("dCaisse").value) * 100),
      banqueCts: Math.round(parseFloat($("dBanque").value) * 100)
    });
  });

  // ---------- AFFICHAGE ----------
  function afficher() {
    const triees = [...ecritures].sort((a, b) =>
      a.date.localeCompare(b.date) || (a.creeLe?.seconds ?? 0) - (b.creeLe?.seconds ?? 0));

    // NOUVEAU : on suit DEUX compteurs en parallèle, au lieu d'un seul
    let caisse = depart.caisseCts || 0;
    let banque = depart.banqueCts || 0;

    $("lignes").innerHTML = triees.map(l => {
      const signe = l.type === "recette" ? 1 : -1;
      // Espèces → caisse. Tout le reste (CB, chèque, virement) → banque.
      if (l.mode === "especes") caisse += signe * l.montantCts;
      else banque += signe * l.montantCts;

      const [a, m, j] = l.date.split("-");
      return `<tr>
        <td>${j}/${m}/${a}</td>
        <td class="designation">${echapper(l.designation)}</td>
        <td><span class="tag">${NOMS_MODES[l.mode]}</span></td>
        <td class="n recette">${l.type === "recette" ? euros(l.montantCts) : ""}</td>
        <td class="n depense">${l.type === "depense" ? euros(l.montantCts) : ""}</td>
        <td class="n"><b>${euros(caisse + banque)}</b></td>
      </tr>`;
    }).join("") || `<tr><td colspan="6" style="color:var(--mute);text-align:center;padding:24px">Aucune écriture pour l'instant.</td></tr>`;

    // À la fin de la boucle, caisse et banque contiennent les soldes ACTUELS
    $("sCaisse").textContent = euros(caisse);
    $("sBanque").textContent = euros(banque);
    $("sTotal").textContent = euros(caisse + banque);
    // Une caisse en espèces ne peut pas être négative : si c'est le cas, c'est une erreur de saisie
    $("sCaisse").style.color = caisse < 0 ? "var(--ko)" : "";
    $("alerteCaisse").textContent = caisse < 0 ? "⚠ Caisse négative : vérifie les écritures en espèces" : "";
  }

  const echapper = s => s.replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
</script>
</body>
</html>
